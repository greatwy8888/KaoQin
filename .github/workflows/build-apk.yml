name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir -p android_project
          unzip -q kaoqin_android.zip -d android_project

          echo "===== ZIP contents ====="
          find android_project -maxdepth 5 -type f | head -100

      - name: Set project directory
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/android_project/kaoqin_android"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "项目目录：$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          echo "项目目录：$PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "===== Project files ====="
          ls -la

          echo "===== Build APK ====="
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "===== APK files ====="
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kaoqin-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
